# PromptForge-Optimizer — fast profile for 8GB GPUs (e.g. RTX 5060 Laptop)
# ~2-3x faster than configs/optimizer.yaml with similar effective batch size.

base_model_name: Qwen/Qwen2.5-0.5B-Instruct
max_seq_length: 512          # was 1024 — biggest speed win
max_new_tokens: 256

num_examples: 5000
seed: 42
train_ratio: 0.90
val_ratio: 0.05
test_ratio: 0.05
task_type: general

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

num_train_epochs: 3
per_device_train_batch_size: 4    # was 2
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4    # effective batch = 16 (same as 2×8)
learning_rate: 2.0e-4
weight_decay: 0.01
warmup_ratio: 0.03
logging_steps: 50
eval_steps: 400                   # less eval overhead
save_steps: 400
save_total_limit: 2
early_stopping_patience: 3

gradient_checkpointing: false     # 0.5B fits at 512 on 8GB — ~25% faster
dataloader_num_workers: 2

prefer_gpu: true
use_fp16: true
use_bf16: false
load_in_4bit: false

output_dir: outputs/promptforge-optimizer
dataset_path: data/promptforge_optimizer_dataset.csv
final_model_dir: outputs/promptforge-optimizer-model
